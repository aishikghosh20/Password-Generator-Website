<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <video autoplay muted loop id="bg-video"> <source src="bg-video.mp4" type="video/mp4"> </video>
        <div id="header">
           <div id="title">
                <h1>
                    PASSWORD GENERATOR
                </h1>
           </div>
        </div>
        <div id="content">
            <div id="result">
                <h2 id="resulttext"></h2>
            </div>
            <br>
            <div id="sliderbox">
                <div id="lengthtext">
                    <label id="lengthlabel" for="length">PASSWORD LENGTH:</label>
                    <p><span id="LengthValue">16</span></p>
                </div>
                <br>
                <input type="range" id="length" min="8" max="32" value="16">

            </div>
            <br>
            <div id="togglecontainer">
                <div class="checkboxes" id="IncludeUppercase">
                    <label for="uppercase" class="toggletext">UPPERCASE :</label>
                    <input type="checkbox" class="checkbox"  id="uppercase">
                </div>
                <br>
                <div class="checkboxes" id="IncludeLowercase">
                    <label for="lowercase" class="toggletext">LOWERCASE:</label>
                    <input type="checkbox" class="checkbox"  id="lowercase">
                </div>
                <br>
                <div class="checkboxes" id="IncludeNumbers">
                    <label for="number" class="toggletext">NUMBERS :</label>
                    <input type="checkbox" class="checkbox"  id="numbers">
                </div>
                <br>
                <div class="checkboxes" id="IncludeSymbols">
                    <label for="symmbols" class="toggletext">SYMBOLS :</label>
                    <input type="checkbox" class="checkbox" id="symbols">
                </div>
                <br>
            </div>
            <br>
            <div id="buttonscontainer">
                <button class="buttons" id="generate">GENERATE</button>
                <button class="buttons" id="copy">COPY</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
